<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" width="100%" height="100%">
  <defs>
    <linearGradient id="cupGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3702D" />
      <stop offset="100%" stop-color="#C8571B" />
    </linearGradient>
    <linearGradient id="brimGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B4348" />
      <stop offset="100%" stop-color="#1E3135" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Cup and Cap Group -->
  <g id="logo-mark" filter="url(#dropShadow)">
    <!-- Steam Swirl -->
    <path d="M 295 85 C 310 110, 290 135, 305 160 C 300 150, 302 140, 292 125 C 285 110, 292 95, 295 85 Z" fill="#1E3135" />

    <!-- Cup Rim Outer -->
    <ellipse cx="300" cy="170" rx="115" ry="32" fill="#1E3135" />
    <!-- Cup Rim Inner / Liquid Surface -->
    <ellipse cx="300" cy="170" rx="98" ry="22" fill="#FBFBFA" />

    <!-- Handle on Right -->
    <path d="M 385 200 C 445 205, 445 305, 385 305 C 415 305, 420 205, 385 200 Z" fill="#C8571B" />
    <path d="M 380 195 C 455 200, 455 315, 380 315" fill="none" stroke="#C8571B" stroke-width="24" stroke-linecap="round" />

    <!-- Cup Body -->
    <path d="M 188 175 C 190 280, 220 330, 300 335 C 380 330, 410 280, 412 175 Z" fill="url(#cupGradient)" />
    <!-- Cup Vertical Highlight -->
    <rect x="212" y="210" width="12" height="65" rx="6" fill="#FFFFFF" opacity="0.75" />
    <!-- Inner Shadow Curve -->
    <path d="M 345 195 C 390 230, 395 290, 360 325 C 395 290, 395 230, 345 195 Z" fill="#000000" opacity="0.15" />

    <!-- Cap Brim / Visor (Flowing Wave Under Cup) -->
    <path d="M 130 365 C 150 340, 200 325, 260 340 C 320 355, 380 350, 415 315 L 415 345 C 375 375, 305 385, 240 365 C 180 350, 150 365, 140 375 C 125 385, 115 375, 130 365 Z" fill="url(#brimGradient)" />
    <path d="M 125 370 C 175 320, 270 330, 415 325 C 415 350, 360 380, 270 375 C 190 370, 145 390, 125 370 Z" fill="url(#brimGradient)" />
  </g>

  <!-- Typography -->
  <g id="logo-text" text-anchor="middle" fill="#1E3135">
    <text x="300" y="435" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="42" font-weight="900" letter-spacing="4">CUPS &amp; CAPS</text>
    <text x="300" y="478" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="24" font-weight="700" letter-spacing="12">DESIGN</text>
  </g>
</svg>